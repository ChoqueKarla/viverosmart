apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: viverosmart
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/viverosmart-api:IMAGE_TAG
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: api-secrets
