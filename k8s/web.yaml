apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: viverosmart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/viverosmart-web:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: viverosmart
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
