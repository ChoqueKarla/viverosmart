# No apliques ni subas un archivo con valores reales. En AWS usa Secrets Manager
# con External Secrets; este archivo solo documenta las claves necesarias.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: viverosmart
type: Opaque
stringData:
  DATABASE_URL: postgresql://USUARIO:CLAVE@HOST_RDS:5432/viverosmart?schema=public&sslmode=require
  JWT_SECRET: reemplaza-por-un-secreto-largo-y-aleatorio
  SMTP_HOST: smtp.ejemplo.com
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: usuario
  SMTP_PASS: clave
  SMTP_FROM: no-reply@tu-dominio.com
