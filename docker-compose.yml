services:
  api:
    build: ./backend
    env_file:
      - ./backend/.env
      - ./.env.docker
    environment:
      FRONTEND_URL: http://localhost:8080
      PORT: 5000
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
